<ion-content class="login-content" fullscreen>
  <div class="login-wrapper">

    <!-- Logo / Titull -->
    <div class="brand">
      <div class="logo-circle" style="background: none; box-shadow: none;">
        <img src="logo (2).png" style="width: 120px; height: auto; filter: brightness(0) invert(1);" alt="Logo">
      </div>
      <h1 class="brand-title">Rent a Car</h1>
      <p class="brand-subtitle">Gjoni</p>
    </div>

    <!-- Karta e hyrjes -->
    <ion-card class="login-card">
      <ion-card-content>
        <p class="login-heading">Hyrja</p>

        <!-- Email -->
        <ion-item class="input-item" lines="none">
          <ion-label position="stacked">Username</ion-label>
          <ion-input
            type="text"
            placeholder="p.sh. admin"
            [(ngModel)]="username"
            [disabled]="loading"
            autocomplete="username"
          ></ion-input>
        </ion-item>

        <!-- Fjalëkalimi -->
        <ion-item class="input-item" lines="none">
          <ion-label position="stacked">Fjalëkalimi</ion-label>
          <ion-input
            type="password"
            placeholder="••••••••"
            [(ngModel)]="password"
            [disabled]="loading"
            autocomplete="current-password"
          ></ion-input>
        </ion-item>

        <!-- Gabim -->
        @if (error) {
          <div class="error-box">
            <ion-text color="danger">
              <p>{{ error }}</p>
            </ion-text>
          </div>
        }

        <!-- Butoni Hyr -->
        <ion-button
          expand="block"
          class="login-btn"
          (click)="login()"
          [disabled]="loading || !username || !password"
        >
          @if (loading) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Hyr
          }
        </ion-button>
      </ion-card-content>
    </ion-card>

  </div>
</ion-content>
